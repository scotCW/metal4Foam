version: 2
updates:
  # The only dependency surface this repo actually has: pinned action
  # versions in .github/workflows (e.g. actions/checkout, github/codeql-action).
  # No package.json/requirements.txt/etc. exists - the plugin's real
  # dependencies (OpenFOAM, metal-cpp) are neither fetched by a package
  # manager nor version-pinned by one, so there's nothing else for
  # Dependabot to track here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
